name: Build shell-script-example application
on:
  workflow_dispatch:
  push:
    paths:
      - 'shell-script-example/**'
      - '!shell-script-example/README.md'
      - '.github/workflows/shell-script-example.yml'
jobs:
  test-app:
    name: Test app
    runs-on: ubuntu-latest
    strategy:
      matrix:
        axis-os: ["12.4.59"]
        arch: ["armv7hf", "aarch64"]
    env:
      EXREPO: acap-native-examples
      EXNAME: shell-script-example
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ env.EXNAME }} application
        env:
          imagetag: ${{ env.EXREPO }}_${{ env.EXNAME }}:${{ matrix.arch }}
        run: |
          docker image rm -f $imagetag
          cd $EXNAME
          docker build --no-cache --tag $imagetag --build-arg ARCH=${{ matrix.arch }} .
          docker cp $(docker create $imagetag):/opt/app ./build
          cd ..
          docker image rm -f $imagetag
      - name: Test reproducibility across machines
        run: |
          ./build-and-compare-one.sh ${{ matrix.arch }}
              - name: Archive build artifact
      - uses: actions/upload-artifact@v4
        with:
          name: shell-script-example-${{ matrix.arch }}
          path: ${{ env.EXREPO }}/build/shell_script_example_1_0_0_all.eap
